# Deploys Kubernetes manifests via docker/kubectl_apply.sh to DigitalOcean Kubernetes (DOKS).
#
# Configure the GitHub Environment "production" (or repo-level secrets/variables):
#   Secrets:
#     KUBECONFIG_FILE           — Full kubeconfig content used by kubectl.
#     SOPS_AGE_KEY              — age private key file contents (AGE-SECRET-KEY-1...) or base64 of that file
#                               Must match recipient age1f28gvdqfj0x4ssa2dwaj06sc77gqgrh48770jrvp5xvju8jt3a2q9pp7y4
#
# SSL material for nginx/db (written by setup_ssl.sh; PEM or base64 of PEM):
#   SSL_ROOT_CRT       — volumes/ssl/root.crt
#   SSL_ROOT_KEY       — volumes/ssl/root.key
#   SSL_ROOT_KEY_PASS  — volumes/ssl/root.pass
#
# Nginx basic auth (docker/volumes/nginx/.htpasswd is gitignored; created in CI before apply):
#   NGINX_BASIC_AUTH_USER
#   NGINX_BASIC_AUTH_PASSWORD
name: Production

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: 'Branch, tag, or commit SHA to deploy (defaults to the branch selected when running the workflow)'
        required: false
        type: string
      restart_deployments:
        description: 'Restart deployments after apply so pods pick up new env-secrets'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-kubernetes
  cancel-in-progress: false

jobs:
  deploy-kubernetes:
    name: Deploy Kubernetes cluster (DigitalOcean)
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 120
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.git_ref || github.ref }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext-base openssl apache2-utils dos2unix util-linux

          SOPS_VERSION="3.13.1"
          curl -fsSL "https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64" -o /tmp/sops
          sudo install -m 0755 /tmp/sops /usr/local/bin/sops

          curl -fsSL "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl" -o /tmp/kubectl
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl

          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Write kubeconfig
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG_FILE }}
        run: |
          KUBECONFIG_FILE="${RUNNER_TEMP}/kubeconfig"
          if [[ -z "${KUBECONFIG_CONTENT}" ]]; then
            echo "KUBECONFIG_FILE secret is not set."
            exit 1
          fi
          printf '%s\n' "${KUBECONFIG_CONTENT}" > "${KUBECONFIG_FILE}"
          chmod 600 "${KUBECONFIG_FILE}"
          echo "KUBECONFIG_FILE=${KUBECONFIG_FILE}" >> "${GITHUB_ENV}"

      - name: Decrypt production .env
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          if [[ -z "${SOPS_AGE_KEY}" ]]; then
            echo "SOPS_AGE_KEY secret is not set."
            exit 1
          fi
          if [[ ! -f "${GITHUB_WORKSPACE}/docker/.env.enc" ]]; then
            echo "Missing encrypted env file at docker/.env.enc."
            exit 1
          fi

          sops --decrypt --input-type dotenv --output-type dotenv "${GITHUB_WORKSPACE}/docker/.env.enc" > "${GITHUB_WORKSPACE}/docker/.env"
          cp "${GITHUB_WORKSPACE}/docker/.env" "${GITHUB_WORKSPACE}/.env"
          dos2unix "${GITHUB_WORKSPACE}/docker/.env" "${GITHUB_WORKSPACE}/.env" >/dev/null 2>&1

      - name: Create nginx basic auth
        working-directory: docker
        env:
          NGINX_BASIC_AUTH_USER: ${{ secrets.NGINX_BASIC_AUTH_USER }}
          NGINX_BASIC_AUTH_PASSWORD: ${{ secrets.NGINX_BASIC_AUTH_PASSWORD }}
        run: |
          if [[ -z "${NGINX_BASIC_AUTH_USER}" || -z "${NGINX_BASIC_AUTH_PASSWORD}" ]]; then
            echo "NGINX_BASIC_AUTH_USER and NGINX_BASIC_AUTH_PASSWORD secrets are not set."
            exit 1
          fi
          mkdir -p ./volumes/nginx
          htpasswd -cb ./volumes/nginx/.htpasswd "${NGINX_BASIC_AUTH_USER}" "${NGINX_BASIC_AUTH_PASSWORD}"

      - name: Write SSL material from secrets
        working-directory: docker
        env:
          SSL_ROOT_CRT: ${{ secrets.SSL_ROOT_CRT }}
          SSL_ROOT_KEY: ${{ secrets.SSL_ROOT_KEY }}
          SSL_ROOT_KEY_PASS: ${{ secrets.SSL_ROOT_KEY_PASS }}
        run: |
          missing=()
          [[ -z "${SSL_ROOT_CRT:-}" ]] && missing+=(SSL_ROOT_CRT)
          [[ -z "${SSL_ROOT_KEY:-}" ]] && missing+=(SSL_ROOT_KEY)
          [[ -z "${SSL_ROOT_KEY_PASS:-}" ]] && missing+=(SSL_ROOT_KEY_PASS)
          if ((${#missing[@]})); then
            echo "Missing production SSL secrets: ${missing[*]}"
            echo "Add PEM (or base64 of PEM) for SSL_ROOT_CRT / SSL_ROOT_KEY and the passphrase SSL_ROOT_KEY_PASS."
            exit 1
          fi
          mkdir -p ./volumes/ssl
          # setup_ssl.sh writes root.crt / root.key / root.pass from these env vars.
          source ./setup_ssl.sh
          test -s ./volumes/ssl/root.crt
          test -s ./volumes/ssl/root.key
          test -s ./volumes/ssl/root.pass

      - name: Apply Kubernetes stack
        working-directory: docker
        env:
          KUBECONFIG_FILE: ${{ env.KUBECONFIG_FILE }}
          SSL_ROOT_CRT: ${{ secrets.SSL_ROOT_CRT }}
          SSL_ROOT_KEY: ${{ secrets.SSL_ROOT_KEY }}
          SSL_ROOT_KEY_PASS: ${{ secrets.SSL_ROOT_KEY_PASS }}
        run: |
          # Pseudo-TTY so kubectl exec -it in kubectl_setup_core.sh works non-interactively.
          script -q -e -c "bash kubectl_apply.sh -c \"${KUBECONFIG_FILE}\""

      - name: Restart deployments
        if: inputs.restart_deployments
        working-directory: docker
        env:
          KUBECONFIG_FILE: ${{ env.KUBECONFIG_FILE }}
        run: |
          bash kubectl_restart.sh -c "${KUBECONFIG_FILE}"

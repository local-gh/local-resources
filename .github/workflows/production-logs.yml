# Retrieves logs from Kubernetes pods, focusing on unhealthy and restarting pods.
#
# Configure the GitHub Environment "production" (or repo-level secrets/variables):
#   Secrets:
#     KUBECONFIG_FILE              — Full kubeconfig content used by kubectl.
name: Production Logs

on:
  workflow_dispatch:
    inputs:
      namespace:
        description: 'Kubernetes namespace to get logs from'
        required: false
        type: string
        default: 'default'
      pod_name:
        description: 'Specific pod name (leave empty for all unhealthy/restarting pods)'
        required: false
        type: string
        default: ''
      tail_lines:
        description: 'Number of log lines to retrieve per pod'
        required: false
        type: number
        default: 100
      show_all_logs:
        description: 'Show logs for all pods (not just unhealthy/restarting)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-logs
  cancel-in-progress: true

jobs:
  get-pod-logs:
    name: Get Kubernetes pod logs
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install kubectl
        run: |
          curl -fsSL "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl" -o /tmp/kubectl
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl

      - name: Write kubeconfig
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG_FILE }}
        run: |
          KUBECONFIG_FILE="${RUNNER_TEMP}/kubeconfig"
          if [[ -z "${KUBECONFIG_CONTENT}" ]]; then
            echo "KUBECONFIG_FILE secret is not set."
            exit 1
          fi
          printf '%s\n' "${KUBECONFIG_CONTENT}" > "${KUBECONFIG_FILE}"
          chmod 600 "${KUBECONFIG_FILE}"
          echo "KUBECONFIG_FILE=${KUBECONFIG_FILE}" >> "${GITHUB_ENV}"

      - name: Get pod logs
        working-directory: docker
        env:
          KUBECONFIG_FILE: ${{ env.KUBECONFIG_FILE }}
          NAMESPACE: ${{ inputs.namespace || 'default' }}
          POD_NAME: ${{ inputs.pod_name || '' }}
          TAIL_LINES: ${{ inputs.tail_lines || '100' }}
          SHOW_ALL_LOGS: ${{ inputs.show_all_logs && 'true' || 'false' }}
        run: |
          bash kubectl_logs.sh -c "${KUBECONFIG_FILE}"

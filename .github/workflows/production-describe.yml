# Retrieves detailed descriptions of Kubernetes pods, focusing on unhealthy and restarting pods.
#
# Configure the GitHub Environment "production" (or repo-level secrets/variables):
#   Secrets:
#     KUBECONFIG_FILE              — Full kubeconfig content used by kubectl.
name: Production Describe

on:
  workflow_dispatch:
    inputs:
      namespace:
        description: 'Kubernetes namespace to describe pods from'
        required: false
        type: string
        default: 'default'
      pod_name:
        description: 'Specific pod name (leave empty for all unhealthy/restarting pods)'
        required: false
        type: string
        default: ''
      show_all_pods:
        description: 'Describe all pods (not just unhealthy/restarting)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-describe
  cancel-in-progress: true

jobs:
  describe-pods:
    name: Describe Kubernetes pods
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install kubectl
        run: |
          curl -fsSL "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl" -o /tmp/kubectl
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl

      - name: Write kubeconfig
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG_FILE }}
        run: |
          KUBECONFIG_FILE="${RUNNER_TEMP}/kubeconfig"
          if [[ -z "${KUBECONFIG_CONTENT}" ]]; then
            echo "KUBECONFIG_FILE secret is not set."
            exit 1
          fi
          printf '%s\n' "${KUBECONFIG_CONTENT}" > "${KUBECONFIG_FILE}"
          chmod 600 "${KUBECONFIG_FILE}"
          echo "KUBECONFIG_FILE=${KUBECONFIG_FILE}" >> "${GITHUB_ENV}"

      - name: Describe pods
        working-directory: docker
        env:
          KUBECONFIG_FILE: ${{ env.KUBECONFIG_FILE }}
          NAMESPACE: ${{ inputs.namespace || 'default' }}
          POD_NAME: ${{ inputs.pod_name || '' }}
          SHOW_ALL_PODS: ${{ inputs.show_all_pods && 'true' || 'false' }}
        run: |
          bash kubectl_describe.sh -c "${KUBECONFIG_FILE}"

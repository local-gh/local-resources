apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: C:\Github\mindy-project\core-docker\docker\kubernetes\kompose.exe -f ../docker-compose.core.yml -f ../docker-compose.ai.yml -f ../docker-compose.blog.yml -f ../docker-compose.development.yml -f ../docker-compose.ecommerce.yml -f ../docker-compose.mail.yml -f ../docker-compose.s3.yml convert
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    service: db
  name: db
spec:
  replicas: {{ int .Values.core.db.replicas }}
  selector:
    matchLabels:
      service: db
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        service: db
    spec:
      initContainers:
      - name: init-db
        image: supabase/postgres:15.8.1.085
        command:
          - /bin/sh
          - -c
          - |
            set -e
            mkdir -p /tmp/docker-entrypoint-initdb.d/migrations
            mkdir -p /tmp/docker-entrypoint-initdb.d/init-scripts
            rm -rf /tmp/docker-entrypoint-initdb.d/migrations/* /tmp/docker-entrypoint-initdb.d/init-scripts/*
            # Host-provided SQL and SSL material come from mounted ConfigMaps/Secret
            # (kubectl_apply_core_config.sh); image defaults are layered on top below.
            cp -L /tmp/config/migrations/*.sql /tmp/docker-entrypoint-initdb.d/migrations/
            cp -L /tmp/config/init-scripts/*.sql /tmp/docker-entrypoint-initdb.d/init-scripts/
            mkdir -p /tmp/var/lib/ssl
            cp -L /tmp/config/ssl/server.crt /tmp/config/ssl/server.key /tmp/var/lib/ssl/
            ls /etc/postgresql-custom
            cp -r /etc/postgresql-custom/* /tmp/etc/postgresql-custom
            ls /docker-entrypoint-initdb.d/init-scripts
            cp -r /docker-entrypoint-initdb.d/init-scripts/* /tmp/docker-entrypoint-initdb.d/init-scripts/
            ls /docker-entrypoint-initdb.d/migrations
            cp -r /docker-entrypoint-initdb.d/migrations/* /tmp/docker-entrypoint-initdb.d/migrations/
            # Postgres runs as postgres and must own SSL material (kubectl cp leaves root:root).
            chown -R postgres:postgres /tmp/var/lib/ssl
            chmod 644 /tmp/var/lib/ssl/server.crt
            chmod 600 /tmp/var/lib/ssl/server.key
            chmod -R 700 /tmp/etc/postgresql-custom && chown -R postgres:postgres /tmp/etc/postgresql-custom
        volumeMounts:
          - name: ssl-volume
            mountPath: /tmp/var/lib/ssl
            subPath: ssl
          - name: init-scripts-volume
            mountPath: /tmp/docker-entrypoint-initdb.d/init-scripts
            subPath: init-scripts
          - name: migrations-volume
            mountPath: /tmp/docker-entrypoint-initdb.d/migrations
            subPath: migrations
          - name: data-volume
            mountPath: /var/lib/postgresql/data
            subPath: data
          - name: config-volume
            mountPath: /tmp/etc/postgresql-custom
            subPath: postgresql-custom
          - name: db-migrations
            mountPath: /tmp/config/migrations
            readOnly: true
          - name: db-init-scripts
            mountPath: /tmp/config/init-scripts
            readOnly: true
          - name: db-ssl
            mountPath: /tmp/config/ssl
            readOnly: true
      containers:
        - args:
            - postgres
            - -c
            - config_file=/etc/postgresql/postgresql.conf
            - -c
            - ssl=on
            - -c
            - ssl_cert_file=/var/lib/ssl/server.crt
            - -c
            - ssl_key_file=/var/lib/ssl/server.key
          env:
            - name: POSTGRES_HOST
              value: /var/run/postgresql
            - name: PGDATABASE
              value: postgres
            - name: POSTGRES_DB
              value: postgres
            - name: POSTGRES_PORT
              value: "5432"
            - name: PGPORT
              value: "5432"
            - name: JWT_EXP
              value: "3600"
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: env-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: env-secrets
                  key: POSTGRES_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: env-secrets
                  key: JWT_SECRET
          image: supabase/postgres:15.8.1.085
          resources:
            requests:
              memory: {{ .Values.core.db.memoryRequest | default "512Mi" }}
            limits:
              memory: {{ .Values.core.db.memoryLimit | default "2Gi" }}
          # Gives crash recovery after an unclean stop up to 5 minutes before
          # liveness starts counting; the default 1s exec timeout was killing
          # Postgres mid-recovery whenever the node was under pressure.
          startupProbe:
            exec:
              command:
              - /bin/sh
              - -c
              - 'pg_isready -U postgres -h localhost -p 5432'
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command: 
              - /bin/sh
              - -c
              - 'pg_isready -U postgres -h localhost -p 5432'
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          lifecycle:
            preStop:
              exec:
                command:
                - /bin/sh
                - -c
                # The container runs as root; pg_ctl refuses to run as root.
                - 'gosu postgres pg_ctl stop -m fast -D "${PGDATA:-/var/lib/postgresql/data}" || su -s /bin/sh postgres -c "pg_ctl stop -m fast -D ${PGDATA:-/var/lib/postgresql/data}"'
          livenessProbe:
            exec:
              command:
              - /bin/sh
              - -c
              - 'pg_isready -U postgres -h localhost -p 5432'
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          name: supabase-db
          ports:
            - containerPort: 5432
          volumeMounts:
            - mountPath: /var/lib/ssl
              name: ssl-volume
              subPath: ssl
            - mountPath: /docker-entrypoint-initdb.d/init-scripts
              name: init-scripts-volume
              subPath: init-scripts
            - mountPath: /docker-entrypoint-initdb.d/migrations
              name: migrations-volume
              subPath: migrations
            - mountPath: /var/lib/postgresql/data
              name: data-volume
              subPath: data
            - mountPath: /etc/postgresql-custom
              name: config-volume
              subPath: postgresql-custom
      restartPolicy: Always
      # Room for the preStop fast shutdown to checkpoint instead of SIGKILL (137).
      terminationGracePeriodSeconds: 60
      volumes:
        - name: ssl-volume
          persistentVolumeClaim:
            claimName: db-ssl-volume-claim
        - name: migrations-volume
          persistentVolumeClaim:
            claimName: db-migrations-volume-claim
        - name: init-scripts-volume
          persistentVolumeClaim:
            claimName: db-init-scripts-volume-claim
        - name: data-volume
          persistentVolumeClaim:
            claimName: db-data-volume-claim
        - name: config-volume
          persistentVolumeClaim:
            claimName: db-config-volume-claim
        - name: db-migrations
          configMap:
            name: db-migrations
        - name: db-init-scripts
          configMap:
            name: db-init-scripts
        - name: db-ssl
          secret:
            secretName: db-ssl

apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: C:\Github\mindy-project\core-docker\docker\kubernetes\kompose.exe -f ../docker-compose.core.yml -f ../docker-compose.ai.yml -f ../docker-compose.blog.yml -f ../docker-compose.development.yml -f ../docker-compose.ecommerce.yml -f ../docker-compose.mail.yml -f ../docker-compose.s3.yml convert
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    service: minio
  name: minio
spec:
  replicas: {{ int .Values.s3.minio.replicas }}
  selector:
    matchLabels:
      service: minio
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: C:\Github\mindy-project\core-docker\docker\kubernetes\kompose.exe -f ../docker-compose.core.yml -f ../docker-compose.ai.yml -f ../docker-compose.blog.yml -f ../docker-compose.development.yml -f ../docker-compose.ecommerce.yml -f ../docker-compose.mail.yml -f ../docker-compose.s3.yml convert
        kompose.version: 1.34.0 (cbf2835db)
      labels:
        service: minio
    spec:
      securityContext:
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: fix-data-permissions
          image: docker.io/bitnamilegacy/minio:latest
          command:
            - sh
            - -c
            - '[ "$(stat -c %u /bitnami/minio/data)" = "1001" ] || chown -R 1001:1001 /bitnami/minio/data'
          securityContext:
            runAsUser: 0
          volumeMounts:
            - mountPath: /bitnami/minio/data
              name: minio-data-volume
              subPath: data
      containers:
        - env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: env-secrets
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: env-secrets
                  key: MINIO_ROOT_PASSWORD
          image: docker.io/bitnamilegacy/minio:latest
          resources:
            requests:
              memory: {{ .Values.s3.minio.memoryRequest | default "128Mi" }}
            limits:
              memory: {{ .Values.s3.minio.memoryLimit | default "512Mi" }}
          livenessProbe:
            tcpSocket:
              port: 9000
            failureThreshold: 5
            periodSeconds: 2
            timeoutSeconds: 10
          name: minio
          ports:
            - containerPort: 9000
              protocol: TCP
            - containerPort: 9001
              protocol: TCP
          volumeMounts:
            - mountPath: /bitnami/minio/data
              name: minio-data-volume
              subPath: data
      restartPolicy: Always
      volumes:
      - name: minio-data-volume
        persistentVolumeClaim:
            claimName: minio-data-volume-claim

apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
spec:
  replicas: {{ int .Values.nginx.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      service: nginx-core
  template:
    metadata:
      labels:
        service: nginx-core
    spec:
      initContainers:
      - name: init-nginx
        image: nginx:latest
        command:
          - /bin/sh
          - -c
          - |
            set -e
            mkdir -p /tmp/etc/nginx/conf.d/http /tmp/etc/nginx/conf.d/stream
            # Seed defaults, then remove config so we always wait for a fresh copy from the host.
            cp -a /etc/nginx/. /tmp/etc/nginx/ 2>/dev/null || true
            rm -f /tmp/etc/nginx/nginx.conf /tmp/etc/nginx/.htpasswd
            mkdir -p /tmp/etc/nginx/conf.d/http /tmp/etc/nginx/conf.d/stream
            echo "Waiting for nginx.conf and .htpasswd to be copied onto the volume..."
            while [ ! -s /tmp/etc/nginx/nginx.conf ] || [ ! -s /tmp/etc/nginx/.htpasswd ]; do
              sleep 5
            done
            echo "Nginx config received:"
            ls -la /tmp/etc/nginx/nginx.conf /tmp/etc/nginx/.htpasswd
            ls -la /tmp/etc/nginx/conf.d/http/ || true
        volumeMounts:
          - mountPath: /tmp/etc/nginx
            name: nginx-volume
            subPath: nginx
      containers:
      - name: nginx
        image: nginx:latest
        volumeMounts:
          - mountPath: /etc/nginx
            name: nginx-volume
            subPath: nginx
        ports:
          - containerPort: 80
          - containerPort: 443
      restartPolicy: Always
      volumes:
      - name: nginx-volume
        persistentVolumeClaim:
            claimName: nginx-volume-claim

apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
spec:
  replicas: {{ int .Values.nginx.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      service: nginx-core
  template:
    metadata:
      labels:
        service: nginx-core
      annotations:
        # Substituted by envsubst at apply time (kubectl_setup_nginx.sh exports it)
        # so a config change rolls the pod even though subPath mounts never refresh.
        checksum/nginx-config: "${NGINX_CONFIG_HASH}"
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        resources:
          requests:
            memory: {{ .Values.nginx.memoryRequest | default "32Mi" }}
          limits:
            memory: {{ .Values.nginx.memoryLimit | default "128Mi" }}
        ports:
          - containerPort: 80
          - containerPort: 443
        # Only :80 servers exist when at least one stack is enabled, so this is
        # a readiness (endpoint) gate rather than a liveness probe.
        readinessProbe:
          tcpSocket:
            port: 80
          periodSeconds: 5
          failureThreshold: 3
        volumeMounts:
          - name: nginx-conf
            mountPath: /etc/nginx/nginx.conf
            subPath: nginx.conf
            readOnly: true
          - name: nginx-htpasswd
            mountPath: /etc/nginx/.htpasswd
            subPath: .htpasswd
            readOnly: true
          - name: nginx-conf-http
            mountPath: /etc/nginx/conf.d/http
            readOnly: true
          - name: nginx-conf-stream
            mountPath: /etc/nginx/conf.d/stream
            readOnly: true
      restartPolicy: Always
      volumes:
      - name: nginx-conf
        configMap:
          name: nginx-conf
      - name: nginx-conf-http
        configMap:
          name: nginx-conf-http
      - name: nginx-conf-stream
        configMap:
          name: nginx-conf-stream
      - name: nginx-htpasswd
        secret:
          secretName: nginx-htpasswd

apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: C:\Github\mindy-project\core-docker\docker\kubernetes\kompose.exe -f ../docker-compose.core.yml -f ../docker-compose.ai.yml -f ../docker-compose.blog.yml -f ../docker-compose.development.yml -f ../docker-compose.ecommerce.yml -f ../docker-compose.mail.yml -f ../docker-compose.s3.yml convert
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    service: minio-createbucket
  name: minio-createbucket
spec:
  replicas: 1
  selector:
    matchLabels:
      service: minio-createbucket
  template:
    metadata:
      annotations:
        kompose.cmd: C:\Github\mindy-project\core-docker\docker\kubernetes\kompose.exe -f ../docker-compose.core.yml -f ../docker-compose.ai.yml -f ../docker-compose.blog.yml -f ../docker-compose.development.yml -f ../docker-compose.ecommerce.yml -f ../docker-compose.mail.yml -f ../docker-compose.s3.yml convert
        kompose.version: 1.34.0 (cbf2835db)
      labels:
        service: minio-createbucket
    spec:
      containers:
        - env:
            - name: MINIO_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: env-secrets
                  key: MINIO_ADDRESS
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: env-secrets
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: env-secrets
                  key: MINIO_ROOT_PASSWORD
          # Single -c chain: extra `-c` args are positional parameters, not
          # commands, so the mb never ran. Idempotent mb; stay alive so the
          # Deployment doesn't CrashLoop (a Job shape would be filtered out by
          # the replicas gate in kubectl_setup_templates.sh).
          command:
            - /bin/sh
            - -c
            - 'mc alias set supa-minio http://minio:9000 $MINIO_ROOT_USER $MINIO_ROOT_PASSWORD && mc mb --ignore-existing supa-minio/stub && echo "bucket stub ready" && while true; do sleep 3600; done'
          image: docker.io/bitnamilegacy/minio-client:2025.7.21-debian-12-r3
          resources:
            requests:
              memory: {{ .Values.s3.minioCreatebucket.memoryRequest | default "16Mi" }}
            limits:
              memory: {{ .Values.s3.minioCreatebucket.memoryLimit | default "128Mi" }}
          name: minio-createbucket
      restartPolicy: Always

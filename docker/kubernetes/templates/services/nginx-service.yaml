apiVersion: v1
kind: Service
metadata:
  name: nginx-core
  annotations:
    service.beta.kubernetes.io/do-loadbalancer-type: "REGIONAL"
    service.beta.kubernetes.io/do-loadbalancer-certificate-name: {{ .Values.nginx.digitalocean.certificateName | quote }}
    service.beta.kubernetes.io/do-loadbalancer-tls-ports: "443"
    service.beta.kubernetes.io/do-loadbalancer-http-ports: "80"
    service.beta.kubernetes.io/do-loadbalancer-redirect-http-to-https: "true"
  labels:
    service: nginx-core
spec:
  type: LoadBalancer
  selector:
    service: nginx-core
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
    - name: https
      protocol: TCP
      port: 443
      # After LB TLS termination, traffic to nginx is plain HTTP.
      targetPort: 80

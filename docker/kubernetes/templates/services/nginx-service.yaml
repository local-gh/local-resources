apiVersion: v1
kind: Service
metadata:
  name: nginx-core
  annotations:
    # Required for SSL termination.
    service.beta.kubernetes.io/do-loadbalancer-type: "REGIONAL"

    # Port 80 uses HTTP.
    service.beta.kubernetes.io/do-loadbalancer-protocol: "http"
    service.beta.kubernetes.io/do-loadbalancer-http-ports: "80"

    # Port 443 terminates TLS at DigitalOcean.
    service.beta.kubernetes.io/do-loadbalancer-tls-ports: "443"
    # Omitted when certificateName is empty (local Docker Desktop has no DO
    # certificate) — kubectl_setup_templates.sh warns and continues in that case.
    {{- with .Values.nginx.digitalocean.certificateName }}
    service.beta.kubernetes.io/do-loadbalancer-certificate-name: {{ . | quote }}
    {{- end }}

    service.beta.kubernetes.io/do-loadbalancer-redirect-http-to-https: "true"
    service.beta.kubernetes.io/do-loadbalancer-disable-lets-encrypt-dns-records: "false"

  labels:
    service: nginx-core

spec:
  type: LoadBalancer

  selector:
    service: nginx-core

  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80

    - name: https
      protocol: TCP
      port: 443

      # DigitalOcean decrypts HTTPS and forwards HTTP.
      targetPort: 80
apiVersion: v1
kind: Service
metadata:
  name: nginx-core
  annotations:
    # TCP passthrough so nginx terminates TLS with /etc/ssl/root.{crt,key}.
    service.beta.kubernetes.io/do-loadbalancer-protocol: "tcp"
    service.beta.kubernetes.io/do-loadbalancer-tls-passthrough: "true"
    service.beta.kubernetes.io/do-loadbalancer-disable-lets-encrypt-dns-records: "false"
  labels:
    service: nginx-core
spec:
  type: LoadBalancer
  selector:
    service: nginx-core
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
    - name: https
      protocol: TCP
      port: 443
      targetPort: 443

apiVersion: v1
kind: Service
metadata:
  name: nginx-core
  annotations:
    # DO LB terminates TLS with a trusted cert; nginx receives plain HTTP on :80.
    service.beta.kubernetes.io/do-loadbalancer-protocol: "http"
    service.beta.kubernetes.io/do-loadbalancer-tls-ports: "443"
{{- if .Values.nginx.digitalocean.certificateName }}
    service.beta.kubernetes.io/do-loadbalancer-certificate-name: "{{ .Values.nginx.digitalocean.certificateName }}"
{{- end }}
    service.beta.kubernetes.io/do-loadbalancer-redirect-http-to-https: "true"
    service.beta.kubernetes.io/do-loadbalancer-disable-lets-encrypt-dns-records: "false"
  labels:
    service: nginx-core
spec:
  type: LoadBalancer
  selector:
    service: nginx-core
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
    - name: https
      protocol: TCP
      port: 443
      targetPort: 80
